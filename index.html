<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Partacular" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<meta name="theme-color" content="#0d0f14" />
<title>Partacular</title>
<style>
  :root { --bg:#0d0f14; --panel:#161a22; --panel2:#1d2330; --text:#e8ecf4; --dim:#8b93a7; --accent:#4da3ff; --danger:#ff5d5d; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  #app { position:fixed; inset:0; touch-action:none; }
  canvas { display:block; }
  .topbar { position:fixed; top:0; left:0; right:0; display:flex; align-items:center; gap:8px; flex-wrap:nowrap;
    padding:calc(env(safe-area-inset-top) + 10px) max(14px, env(safe-area-inset-right)) 10px max(14px, env(safe-area-inset-left));
    pointer-events:none; z-index:10; min-width:0; }
  .topbar > * { pointer-events:auto; }
  .brand { font-weight:800; letter-spacing:.12em; font-size:15px; color:var(--text); }
  .brand span { color:var(--accent); }
  .chip { background:var(--panel); border:1px solid #2a3140; color:var(--dim); border-radius:999px;
    padding:6px 12px; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex-shrink:1; min-width:0; }
  .spacer { flex:1; }
  button.btn { background:var(--panel); color:var(--text); border:1px solid #2a3140; border-radius:12px;
    padding:10px 14px; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; flex-shrink:0; }
  button.btn.primary { background:var(--accent); border-color:var(--accent); color:#04101f; }
  button.btn:active { transform:scale(.97); }
  .bottombar { position:fixed; left:0; right:0; bottom:0; z-index:10; padding:10px 14px calc(env(safe-area-inset-bottom) + 12px);
    display:flex; flex-direction:column; gap:10px; pointer-events:none; }
  .bottombar > * { pointer-events:auto; }
  .explode-row { display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid #2a3140;
    border-radius:14px; padding:10px 14px; }
  .explode-row label { font-size:12px; color:var(--dim); font-weight:700; letter-spacing:.08em; }
  input[type=range] { flex:1; accent-color:var(--accent); height:28px; }
  .axisrow { display:flex; align-items:center; gap:10px; }
  .axisrow label { font-size:12px; color:var(--dim); font-weight:700; letter-spacing:.06em; width:44px; }
  .axisrow span { font-size:12px; color:var(--dim); width:52px; text-align:right; font-variant-numeric:tabular-nums; }
  .axisrow .sizename { width:auto; text-align:left; color:var(--text); font-size:13px; font-weight:700; }
  .axisrow button.btn { padding:6px 14px; font-size:13px; border-radius:10px; }
  #pill.hidden-for-size { display:none !important; }
  /* while a size slider is being dragged, ghost the whole bottom stack so the
     part stays visible through it */
  .bottombar.adjusting > * { opacity:.18; }
  .bottombar > * { transition:opacity .15s; }
  #pill { display:none; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  #pill.show { display:flex; }
  #pill .pname { flex:1; text-align:left; }
  #pillcolor { width:30px; height:30px; border-radius:999px; border:2px solid #fff3 !important; padding:0 !important; background:#4da3ff; }
  #sheet { position:fixed; inset:0; display:none; align-items:flex-end; justify-content:center; z-index:40;
    background:rgba(0,0,0,.55); }
  #sheet.show { display:flex; }
  .sheet-card { background:var(--panel2); border:1px solid #313a4d; border-radius:20px 20px 0 0; width:100%;
    max-width:480px; padding:18px 18px calc(env(safe-area-inset-bottom) + 18px); display:flex; flex-direction:column; gap:10px; }
  .sheet-title { font-size:14px; font-weight:800; letter-spacing:.08em; color:var(--dim); text-align:center; margin-bottom:4px; }
  #pill .pname { font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:60px; }
  #pill button { border:none; border-radius:999px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; }
  #pill .hide { background:#2a3140; color:var(--text); }
  #pill .del { background:var(--danger); color:#fff; }
  #drop { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; z-index:20; background:radial-gradient(ellipse at 50% 40%, #141926 0%, var(--bg) 70%); }
  #drop.hidden { display:none; }
  #drop h1 { font-size:34px; font-weight:800; letter-spacing:.14em; }
  #drop h1 span { color:var(--accent); }
  #drop p { color:var(--dim); font-size:14px; max-width:280px; text-align:center; line-height:1.5; }
  #drop .buttons { display:flex; gap:12px; margin-top:8px; }
  #toast { position:fixed; top:calc(env(safe-area-inset-top) + 58px); left:50%; transform:translateX(-50%);
    background:var(--panel2); border:1px solid #313a4d; color:var(--text); font-size:13px; border-radius:10px;
    padding:9px 14px; z-index:30; opacity:0; transition:opacity .25s; pointer-events:none; max-width:86vw; text-align:center; }
  #toast.show { opacity:1; }
  #undo { display:none; }
  #undo.show { display:inline-block; }
  input[type=file] { display:none; }
  @media (max-width: 430px) {
    .brand { font-size:13px; letter-spacing:.08em; }
    .chip { font-size:11px; padding:5px 9px; }
    .topbar button.btn { padding:8px 11px; font-size:13px; border-radius:10px; }
    .topbar { gap:6px; }
  }
  /* phones: keep the Size panel small — measured 16% of a 430px-wide screen
     (the pre-fix stack covered ~45% and buried the model) */
  @media (max-width: 480px) {
    .bottombar { gap:6px; padding-bottom:calc(env(safe-area-inset-bottom) + 8px); }
    #sizerow { padding:6px 12px; gap:2px; }
    #sizerow .axisrow { gap:8px; }
    #sizerow input[type=range] { height:20px; }
    #sizerow .axisrow label { width:36px; font-size:11px; }
    #sizerow .axisrow span { width:44px; font-size:11px; }
    .axisrow .sizename { font-size:12px; }
    #sizerow button.btn { padding:4px 12px; font-size:12px; }
  }

  /* ---- parts list: a slide-in drawer so a hundred parts stay manageable ---- */
  #partspanel {
    /* Sits BELOW the top bar, not over it: covering Save and Open the moment
       you open the parts list is how you strand someone mid-edit. */
    position:fixed; top:58px; right:0; bottom:0; width:min(340px, 88vw); z-index:30;
    background:#12151c; border-left:1px solid #232838; border-top:1px solid #232838;
    border-radius:12px 0 0 0;
    display:flex; flex-direction:column;
    transform:translateX(100%); transition:transform .18s ease;
    pointer-events:auto;
  }
  #partspanel.show { transform:translateX(0); }
  #partspanel header {
    display:flex; align-items:center; gap:8px; padding:12px 14px;
    border-bottom:1px solid #232838; flex:none;
  }
  #partspanel header .t { font-weight:700; font-size:14px; }
  #partspanel header .c { color:#7c869c; font-size:12px; }
  #partslist { flex:1; overflow-y:auto; overscroll-behavior:contain; padding:6px; }
  .prow {
    display:flex; align-items:center; gap:10px; width:100%;
    background:none; border:1px solid transparent; border-radius:10px;
    padding:9px 10px; text-align:left; color:var(--text); cursor:pointer;
    min-height:46px; font:inherit;
  }
  .prow:hover { background:#1a1f2b; }
  .prow.on { background:#17314e; border-color:#2f6ba8; }
  .prow.off { opacity:.42; }
  .prow .sw { width:14px; height:14px; border-radius:4px; flex:none; }
  .prow .nm { flex:1; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .prow .ct { font-size:11px; color:#7c869c; font-variant-numeric:tabular-nums; }
  .prow .eye { font-size:12px; color:#7c869c; flex:none; }
  #partsbulk {
    flex:none; border-top:1px solid #232838; padding:10px 12px;
    display:none; gap:8px; flex-wrap:wrap; align-items:center;
  }
  #partsbulk.show { display:flex; }
  #partsbulk .n { font-size:12px; color:#9aa4b8; flex:1; }
  #partsbulk button { padding:8px 12px; font-size:12px; border-radius:9px; }
  #partsfoot { flex:none; padding:8px 12px 12px; display:flex; gap:8px; border-top:1px solid #232838; }
  #partsfoot button { flex:1; padding:8px; font-size:12px; border-radius:9px; }
  @media (max-width:520px) {
    #partspanel { width:100%; top:auto; height:min(62vh, 520px); border-left:none; border-top:1px solid #232838;
                  transform:translateY(100%); border-radius:16px 16px 0 0; }
    #partspanel.show { transform:translateY(0); }
    #partspanel.show { transform:translateY(0); }
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div class="topbar">
    <div class="brand">PART<span>ACULAR</span></div>
    <div class="chip" id="partcount">no model</div>
    <div class="spacer"></div>
    <button class="btn" id="undo">Undo</button>
    <button class="btn" id="splitbtn" style="display:none">Split</button>
    <button class="btn" id="partsbtn">Parts</button>
    <button class="btn" id="tidybtn" style="display:none">Tidy</button>
    <button class="btn" id="dropbtn">Drop</button>
    <button class="btn" id="stancebtn">Stance</button>
    <button class="btn" id="fitbtn">Fit</button>
    <button class="btn" id="savebtn">Save</button>
    <button class="btn" id="openbtn">Open</button>
  </div>
  <!-- Parts list. Multi-select with a tap; bulk actions apply to the lot. -->
  <div id="partspanel">
    <header>
      <span class="t">Parts</span>
      <span class="c" id="partspanelcount">0</span>
      <span style="flex:1"></span>
      <button class="btn" id="partsclose">Close</button>
    </header>
    <div id="partslist"></div>
    <div id="partsbulk">
      <span class="n" id="partsbulkn">0 selected</span>
      <button class="btn" id="bulkhide">Hide</button>
      <button class="btn" id="bulkmerge">Merge</button>
      <button class="btn del" id="bulkdelete" style="background:var(--danger);color:#fff;border-color:var(--danger)">Delete</button>
    </div>
    <div id="partsfoot">
      <button class="btn" id="selectall">Select all</button>
      <button class="btn" id="selectnone">Select none</button>
      <button class="btn" id="selecttiny">Select tiny</button>
    </div>
  </div>

  <div class="bottombar">
    <!-- Touch-select: what is currently held, and the one action on it. -->
    <div id="pickbar" class="explode-row" style="display:none">
      <div class="pname" id="pickinfo">piece</div>
      <button class="hide" id="pickless">Less</button>
      <button class="hide" id="pickmore">More</button>
      <button class="btn primary" id="picktake">Take piece</button>
      <button class="hide" id="pickcolor" title="Take it out and recolour it">Colour</button>
      <button class="del" id="pickdelete" style="background:var(--danger);color:#fff">Delete</button>
      <button class="hide" id="pickcancel">Cancel</button>
    </div>

    <div id="pill" class="explode-row">
      <div class="pname" id="pillname">part</div>
      <button id="pillcolor" title="Change color"></button>
      <button class="hide" id="pillsize">Size</button>
      <button class="hide" id="pillcarve" title="Draw to separate a piece">Carve</button>
      <button class="hide" id="pilljoin" title="Tap another part to merge">Join</button>
      <button class="hide" id="pillcopy">Copy</button>
      <button class="hide" id="pillrot">⟳ 45°</button>
      <button class="hide" id="pillhide">Hide</button>
      <button class="del" id="pilldel">Delete</button>
    </div>
    <!-- Stance: tilt the model about its lateral axis. Not a reshape - the
         geometry is untouched, the whole thing just sits at an angle. -->
    <div id="stancerow" class="explode-row" style="display:none; flex-direction:column; align-items:stretch; gap:6px;">
      <div class="axisrow">
        <span class="sizename" id="stancename">whole model</span>
        <span style="flex:1"></span>
        <button class="btn" id="stancedrop">Drop to plate</button>
        <button class="btn" id="stancelevel">Level</button>
        <button class="btn" id="stancedone">Done</button>
      </div>
      <div class="axisrow">
        <label>RAKE</label>
        <input type="range" id="rake" min="-150" max="150" value="0" />
        <span id="rakev">0.0°</span>
      </div>
    </div>

    <div id="sizerow" class="explode-row" style="display:none; flex-direction:column; align-items:stretch; gap:6px;">
      <div class="axisrow"><span class="sizename" id="sizename">part</span><span style="flex:1"></span><button class="btn" id="sizedone">Done</button></div>
      <div class="axisrow"><label>W&nbsp;(X)</label><input type="range" id="scalex" min="0" max="100" value="50" /><span id="scalexv">1.00×</span></div>
      <div class="axisrow"><label>H&nbsp;(Y)</label><input type="range" id="scaley" min="0" max="100" value="50" /><span id="scaleyv">1.00×</span></div>
      <div class="axisrow"><label>L&nbsp;(Z)</label><input type="range" id="scalez" min="0" max="100" value="50" /><span id="scalezv">1.00×</span></div>
    </div>
    <div class="explode-row" id="exploderow">
      <label>EXPLODE</label>
      <input type="range" id="explode" min="0" max="100" value="0" />
    </div>
  </div>
  <div id="drop">
    <h1>PART<span>ACULAR</span></h1>
    <p>Drop in a 3D model. It splits into parts. Tap a part to select it. That's the whole manual.</p>
    <div class="buttons">
      <button class="btn primary" id="uploadbtn">Open a model</button>
      <button class="btn" id="demobtn">Try the demo</button>
    </div>
    <p style="font-size:12px">GLB &middot; GLTF &middot; OBJ &middot; STL</p>
  </div>
  <div id="sheet">
    <div class="sheet-card">
      <div class="sheet-title">Save model</div>
      <button class="btn primary" id="exportglb">GLB — keeps parts &amp; colors</button>
      <button class="btn" id="exportstl">STL — for 3D printing</button>
      <button class="btn" id="export3mf">3MF — merged watertight, print-ready</button>
      <button class="btn" id="sheetcancel">Cancel</button>
    </div>
  </div>
  <div id="toast"></div>
  <input type="file" id="fileinput" accept=".glb,.gltf,.obj,.stl" />
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
